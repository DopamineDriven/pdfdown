
[package]
edition = "2024"

name = "pdfdown"
version = "0.9.9"

[lib]
crate-type = ["cdylib"]

[dependencies]
hayro-jpeg2000 = { version = "0.4.1", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
flate2 = "1.1.10"
lopdf = "0.46.0"
napi = { version = "3.15.0", features = ["napi6"] }
napi-derive = "3.6.13"
rayon = "1.12.0"
# 0.4 defaults to `build-tesseract`, which downloads and compiles Leptonica + Tesseract from
# source via cmake at build time. Link the system libraries instead (libtesseract-dev,
# libleptonica-dev), matching the runtime contract documented in ocr/README.md.
tesseract-rs = { version = "0.4.0", optional = true, default-features = false, features = [
  "use-system-tesseract",
] }
pdfium-render = { version = "0.9.4", optional = true, default-features = false, features = [
  "pdfium_latest",
  "image_025",
  "thread_safe",
] }

[features]
default = []
ocr = ["tesseract-rs"]
render = ["pdfium-render"]

[build-dependencies]
napi-build = "2.6.0"
# 0.2.16–0.2.17 broke the OpenSSL fallback path (missing Tlsv13 arm) on older
# system OpenSSL; fixed in 0.2.18.
native-tls = "0.2.18"

[profile.release]
lto = true
strip = "symbols"
